# 이번에는 .properties 가 아니라 YAML 파일이다!
# 라우팅 규칙은 계층이 깊고 목록이 많아서 YAML 언어가 쓰기 더 쉽다.
spring:
  application:
    name: gateway-server
  cloud:
    gateway:
      server:
        webflux:
          # 모든 라우트 공통 필터: 응답에 게이트웨이를 거쳤다는 신호를 보낸다. 디버깅용.
          default-filters:
            - AddResponseHeader=X-Passed-Through, gateway-server
          routes:
            # 라우트 1: 주문, /orders 로 시작하는 요청은 order-service로 가라.
            # 이때, uri에 localhost 안 쓰기 위해 Eureka를 들여오자.
            # 들여오면 lb를 이용해서 이름으로 정의 가능! lb는 게이트웨이판 @LoadBalanced
            - id: order-route
              uri: lb://order-service
              predicates:
                - Path=/orders/**
            # 라우트 2: 상품
            - id: product-route
              uri: lb://product-service
              predicates:
                - Path=/products/**
            # 라우트3: 결제
            - id: payment-route
              uri: lb://payment-service
              predicates:
                - Path=/payments/**
            # 라우트 4: 판매
            - id: seller-route
              uri: lb://seller-service
              predicates:
                - Path=/sellers/**
            # 라우트 5: 결제
            - id: settlement-route
              uri: lb://settlement-service
              predicates:
                - Path=/settlements/**
            # 라우트 6: 장바구니
            - id: cart-route            # /users/** 보다 구체적이므로 반드시 user-route 위에
              uri: lb://cart-service    # 그렇게 안 하면 잡아먹힘
              predicates:
                - Path=/users/*/cart/**
            # 라우트 7: 회원
            - id: user-route
              uri: lb://user-service
              predicates:
                - Path=/users/**



# 전화번호부의 위치를 명시
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

# 이제부터 라우팅 시작
server:
  port: 8000

management:
  endpoint:
    gateway:
      access: read-only
  endpoints:
    web:
      exposure:
        include: gateway
